
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Escape Within</title>
    <link rel="stylesheet" href="a4.css">
</head>

<body>

    <h1>THE ESCAPE WITHIN</h1>
    <p>Stress Management and Mindfulness Escape Room</p>

    <canvas id="MyCanvas"></canvas>

    <div id="gameControls">

        <input id="playerName" placeholder="Enter Your Name">
        <input id="teamName" placeholder="Enter Team Name">

        <select id="playerNumber">
            <option value="0">Player 1</option>
            <option value="1">Player 2</option>
            <option value="2">Player 3</option>
            <option value="3">Player 4</option>
            <option value="4">Player 5</option>
        </select>

        <button onclick="startGame()">Start Game</button>

    </div>

    <div id="drawingControls" style="display:none">
        <p>Choose a colour and draw your emotion!</p>

        <input type="color" id="drawColor" value="#ff88cc">

        <button onclick="clearDrawing()">Clear Drawing</button>
        <button onclick="finishDrawing()">Finish Drawing</button>
    </div>

    <div id="gardenControls" style="display:none">
        <p>Write a thought you would like to release.</p>

        <input id="stressThought" placeholder="Your thought stays private">

        <button onclick="releaseThought()">Release Into the Sky</button>
    </div>

    <div id="vaultControls" style="display:none">
        <p>Work together to find the secret phrase!</p>

        <input id="vaultAnswer" placeholder="Enter the final phrase">

        <button onclick="checkVault()">Unlock Vault</button>
    </div>

    <script src="escapeRoom.js"></script>

</body>
</html>
